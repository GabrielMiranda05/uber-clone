spring:
  application:
    name: uberclone
  profiles:
    default: dev
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
